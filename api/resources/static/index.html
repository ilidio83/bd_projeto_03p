<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - UNIESP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

<aside class="w-64 bg-slate-900 text-white flex flex-col transition-all">
    <div class="h-16 flex items-center justify-center border-b border-slate-800">
        <h1 class="text-xl font-bold tracking-wider"><i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i>Aluno Online</h1>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2">
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-4 px-2">Cadastros</div>
        <button onclick="mudarEntidade('alunos')" id="menu-alunos" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 bg-blue-600 rounded-lg transition-colors text-white">
            <i class="fa-solid fa-users w-5"></i><span>Alunos</span>
        </button>
        <button onclick="mudarEntidade('professores')" id="menu-professores" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors text-slate-300">
            <i class="fa-solid fa-chalkboard-user w-5"></i><span>Professores</span>
        </button>
        <button onclick="mudarEntidade('disciplinas')" id="menu-disciplinas" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors text-slate-300">
            <i class="fa-solid fa-book w-5"></i><span>Disciplinas</span>
        </button>

        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-6 px-2">Análise</div>
        <button onclick="abrirTelaRelatorios()" id="menu-relatorios" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors text-slate-300">
            <i class="fa-solid fa-chart-pie w-5"></i><span>Relatórios Dinâmicos</span>
        </button>
        <button onclick="mudarEntidade('matriculas')" id="menu-matriculas" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors text-slate-300">
            <i class="fa-solid fa-clipboard-user w-5"></i><span>Matrículas</span>
        </button>
        <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-6 px-2">Análise</div>

        <button onclick="mudarEntidade('boletins')" id="menu-boletins" class="menu-btn w-full flex items-center space-x-3 px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors text-slate-300">
            <i class="fa-solid fa-id-card-clip w-5"></i><span>Boletim Geral</span>
        </button>
    </nav>
</aside>

<main class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="h-16 bg-white shadow-sm flex items-center px-8 justify-between z-10">
        <h2 id="tituloPagina" class="text-2xl font-semibold text-gray-800">Gestão de Alunos</h2>

        <div id="headerAcoesCrud">
            <button onclick="abrirModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md shadow flex items-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Novo Registro
            </button>
        </div>
        <div id="headerAcoesRelatorio" class="hidden">
            <button onclick="exportarCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-md shadow flex items-center gap-2 transition">
                <i class="fa-solid fa-file-csv"></i> Exportar CSV/Excel
            </button>
        </div>
    </header>

    <div id="telaCrud" class="flex-1 overflow-auto p-8 block">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200" id="tabelaCrudExport">
                <thead class="bg-gray-50" id="tabelaHead"></thead>
                <tbody class="divide-y divide-gray-200" id="tabelaBody"></tbody>
            </table>
        </div>
    </div>

    <div id="telaRelatorio" class="flex-1 overflow-auto p-8 hidden">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4"><i class="fa-solid fa-filter text-blue-500 mr-2"></i>Construtor de Relatório</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">1. Selecione a Origem</label>
                    <select id="selectTabela" onchange="carregarCamposRelatorio()" class="w-full bg-gray-50 border border-gray-300 rounded-md py-2 px-3 focus:ring-2 focus:ring-blue-500 outline-none text-gray-700">
                        <option value="">-- Escolha --</option>
                        <option value="aluno">Alunos</option>
                        <option value="professor">Professores</option>
                        <option value="disciplina">Disciplinas</option>
                        <option value="matricula_aluno">Matrículas Brutas</option>
                        <option value="vw_boletim_aluno">Boletim Escolar (Visão)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">2. Selecione as Colunas</label>
                    <div id="containerCheckboxes" class="flex flex-wrap gap-3 p-3 bg-gray-50 border border-gray-200 rounded-md min-h-[46px]">
                        <span class="text-gray-400 text-sm italic">Selecione uma tabela primeiro...</span>
                    </div>
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="gerarRelatorio()" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2 rounded-md shadow flex items-center gap-2 transition">
                    <i class="fa-solid fa-bolt"></i> Processar Dados
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200" id="tabelaRelatorioExport">
                <thead class="bg-gray-50" id="relatorioHead"></thead>
                <tbody class="divide-y divide-gray-200" id="relatorioBody">
                <tr><td colspan="100%" class="text-center py-10 text-gray-400"><i class="fa-solid fa-table mr-2"></i> O relatório aparecerá aqui</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div id="modalForm" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all">
        <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
            <h3 id="modalTitulo" class="text-lg font-bold text-gray-800">Cadastrar Novo</h3>
            <button onclick="fecharModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form id="formularioDinamico" class="p-6 space-y-4">
            <div id="camposFormulario" class="space-y-4"></div>
            <div id="mensagemAlerta" class="hidden rounded-md p-3 text-sm font-medium text-center mt-2"></div>
            <div class="pt-4 flex justify-end gap-3">
                <button type="button" onclick="fecharModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md transition">Cancelar</button>
                <button type="submit" id="btnSalvar" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-save"></i> Salvar
                </button>
            </div>
        </form>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
